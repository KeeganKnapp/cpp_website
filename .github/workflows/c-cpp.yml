name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - run: echo $(pwd)
    - run: ls
    - run: cd ./workspace/hello-world/controllers/
    - run: echo "current directory ls:"
    - run: ls
    - run: echo "parent directory ls:"
    - run: ls ..
    - run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
    - run: make -j
