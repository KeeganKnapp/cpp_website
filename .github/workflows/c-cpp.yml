name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./workspace/hello-world/controllers/

    steps:
    - uses: actions/checkout@v4
    - run: echo $(pwd)
    - run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..
    - run: make -j
