name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name : checkout main repo
      uses: actions/checkout@v4

    - name: checkout drogon
      uses: actions/checkout@v4
      with:
        repository: drogonframework/drogon
        submodules: recursive
        path: ./drogon

    - run: ls

